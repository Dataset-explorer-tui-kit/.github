:#fef3c7;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-30.4">LATER: COLLECT</tspan><tspan x="0" y="-6.4">EXAMPLES</tspan><tspan x="0" y="17.6">Which fields helped?</tspan><tspan x="0" y="41.6">Which searches failed?</tspan></text></g><g class="pele-node pele-shape-rect optional" data-id="improve" transform="translate(370.57,994)"><rect x="-108.27" y="-48" width="216.54" height="96" fill="#1e293b" stroke="#475569" style="rx:10px;fill:#3b2d18;stroke:#fbbf24;"/><text class="pele-label" style="fill:#fef3c7;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">FUTURE: USE DSPy</tspan><tspan x="0" y="5.6">Try better field choices.</tspan><tspan x="0" y="29.6">Test on unseen requests.</tspan></text></g></g></svg>